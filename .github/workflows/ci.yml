name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build web bundle for embed
        working-directory: web
        run: npm ci && npm run build

      # Must stay ahead of `make test`. Beyond running the web unit suite, this
      # regenerates testdata/crypto/*_fixtures.json from the current TypeScript
      # crypto, which the Go interop tests then read back. Run the other way
      # round (or not at all) and those tests only prove Go can still decrypt
      # fixtures committed from someone's laptop, not that the two
      # implementations currently agree.
      - name: test web
        working-directory: web
        run: npm test

      - name: go mod download
        run: go mod download

      - name: verify go.mod / go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build
        run: make build

      - name: test (race detector)
        run: make test

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # This also runs the `postinstall` hook (`wxt prepare`), which generates
      # the extension/.wxt type declarations that typecheck and both builds
      # need. That directory is gitignored, so this step is not optional.
      #
      # No `npm ci` in web/ is needed here, unlike mobile.yml. The extension's
      # tsconfig does compile files from web/src/shared/, but their only
      # non-relative import is hash-wasm, which the same tsconfig maps to the
      # extension's own node_modules. Verified from a clean checkout with no
      # web/node_modules present.
      - name: install
        working-directory: extension
        run: npm ci

      - name: typecheck
        working-directory: extension
        run: npm run typecheck

      - name: test
        working-directory: extension
        run: npm test

      - name: build (chrome)
        working-directory: extension
        run: npm run build

      - name: build (firefox)
        working-directory: extension
        run: npm run build:firefox
